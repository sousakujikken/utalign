name: ci

# Commit CI on release-branch pushes (and manual dispatch once on the default branch).
# Offline/synthetic tests only: no model downloads, no secrets, no publish steps.
on:
  push:
    branches: ['release/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      UV_PYTHON_DOWNLOADS: never
      UV_NO_CONFIG: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check runner architecture
        run: test "$(uname -m)" = arm64

      - name: Install uv
        run: python -m pip install uv==0.12.15

      # Runtime and dev (pytest) versions come from the committed uv.lock (--frozen: never re-resolve or
      # update the lock; hashes are checked). editdistance 0.8.1 has no cp313 macOS wheel in the lock, so its
      # hash-pinned sdist is compiled on the runner; its build-time tools are resolved by uv and are not pinned.
      - name: Create test environment from uv.lock
        run: |
          echo "UTALIGN_HOME=$RUNNER_TEMP/utalign-home" >> "$GITHUB_ENV"
          uv sync --frozen --extra dev --python "$(command -v python)"

      - name: Check that utalign is imported from this commit
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          uv run --frozen --no-sync python -c "
          import os, pathlib, tomllib, utalign
          src = pathlib.Path(utalign.__file__).resolve()
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()
          assert src.is_relative_to(root), src
          ver = tomllib.loads((root / 'pyproject.toml').read_text())['project']['version']
          assert utalign.__version__ == ver, (utalign.__version__, ver)
          print('utalign', ver, 'from', src.relative_to(root))
          "

      - name: Run tests
        run: uv run --frozen --no-sync python -m pytest tests -q
